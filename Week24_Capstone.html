    menu:[['Stakeholder','CEO/Finance cần doanh thu đúng; Ops cần lag thấp; Marketing cần funnel; Product cần retention.'],['Sources','OLTP PostgreSQL, payment/refund API, clickstream events, daily inventory CSV.'],['Serving','Warehouse cho governed BI; ClickHouse/OLAP cho operational event dashboard.'],['Constraint','Team nhỏ, budget vừa phải, ưu tiên correctness cho finance và latency vừa đủ cho ops.']],
    objectives:['Thu thập business requirement có thể chuyển thành data contract.','Xác định SLA/freshness theo từng dashboard.','Vẽ architecture high-level có nguồn, flow và ownership.','So sánh warehouse, lakehouse, OLAP, orchestration, streaming theo trade-off.'],
    detail:`<h3>Từ business question đến system boundary</h3><p>Hãy bắt đầu bằng câu hỏi: ai ra quyết định nào, dựa trên metric nào, cần fresh đến mức nào, và sai số nào là không chấp nhận được. Với NHC Commerce, finance không cần real-time nhưng cần đúng; ops cần biết checkout lag trong vài phút để xử lý incident.</p><table><tr><th>Stakeholder</th><th>Decision</th><th>Freshness</th><th>Metric</th></tr><tr><td>Finance</td><td>Đối soát doanh thu</td><td>Daily 07:00</td><td>Net revenue, refund rate</td></tr><tr><td>Ops</td><td>Phát hiện checkout/payment drop</td><td>5 phút</td><td>Checkout success rate, event lag</td></tr><tr><td>Marketing</td><td>Tối ưu campaign</td><td>Hourly/Daily</td><td>Funnel conversion, CAC proxy</td></tr><tr><td>Product</td><td>Giảm drop-off</td><td>Daily</td><td>Session conversion, cohort retention</td></tr></table><h3>Architecture đề xuất</h3><div class="cmd-block"><div class="cmd-header"><div class="cmd-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div><span>architecture/system_design.md</span></div><div class="cmd-body"><pre>OLTP PostgreSQL orders/payments/customers
 Payment API + Inventory CSV + Web/App Events
--------------------+
 Batch/CDC/API/Event Ingestion
--------------------+
 Raw/Bronze object storage
 Silver conformed tables
 Gold marts in Warehouse
 ClickHouse operational events
--------------------+
 Executive BI + Ops Dashboard + Alerts
--------------------+
 Airflow/dbt tests/lineage/runbooks</pre></div></div><h3>Tool choice reasoning</h3><ul><li><strong>Warehouse:</strong> BigQuery/Snowflake style cho governed marts, BI, access control, SQL analytics.</li><li><strong>Lakehouse/Object storage:</strong> raw replay, schema evolution, giữ source payload để debug.</li><li><strong>OLAP:</strong> ClickHouse cho event dashboard thấp latency, không thay thế finance warehouse.</li><li><strong>Orchestration:</strong> Airflow để schedule batch, CDC sync, dbt build, quality gate và backfill.</li><li><strong>Streaming:</strong> Kafka/Flink hoặc Kafka Connect + stream processor cho clickstream session và lag metrics.</li><li><strong>Infrastructure as Code:</strong> Terraform quản lý bucket raw, warehouse dataset/schema, service account, secrets reference và alert policy để môi trường dev/staging/prod có thể tái tạo bằng Git review.</li></ul><div class="info-box warn">⚠️ <span>Anti-pattern: chọn Kafka, Spark, Iceberg, Airflow chỉ vì trendy hoặc tạo cloud resources bằng UI rồi không ai reproduce được. Mỗi tool phải trả lời được: latency, volume, reliability, team skill hoặc cost nào buộc ta dùng nó?</span></div>`,
    summary:['Requirement tốt bắt đầu từ stakeholder và decision, không bắt đầu từ tool.','Freshness khác nhau: finance daily đúng, ops 5 phút đủ nhanh.','Architecture diagram phải có source, ingestion, storage, transform, serving, ops.','Warehouse phục vụ governed BI; OLAP phục vụ event dashboard latency thấp.','Lake/raw layer bảo vệ khả năng replay và debug.','Tool trendy không có requirement rõ là technical debt.'],
    practices:[['Vẽ architecture v1','Vẽ diagram text hoặc Mermaid cho NHC Commerce từ source đến dashboard, kèm latency từng path.','Tách batch path orders/payments/inventory và streaming path clickstream. Ghi rõ finance mart chạy daily, ops event mart cập nhật 5 phút.'],['Trade-off table','So sánh Snowflake/BigQuery vs DuckDB local vs ClickHouse cho serving layer.','Warehouse thắng về governance/BI; DuckDB tốt demo local; ClickHouse tốt event latency thấp nhưng cần vận hành riêng.']]
  },
  {
    no:'W24.03', title:'Ingestion Layer: Batch, CDC, APIs, Streaming', tag:'Tuần 24 · W24.03', key:'ingest',
    subtitle:'Thiết kế ingestion có raw layer, schema evolution, retry, idempotency, checkpoint, observability và replay strategy.',
    menu:[['Batch','Inventory CSV và product catalog sync daily.'],['CDC','Orders, payments, customers từ OLTP.'],['API','Refund, payment settlement, campaign cost.'],['Streaming','Clickstream events: product_viewed, add_to_cart, checkout_started, payment_succeeded.']],
    objectives:['Chọn pattern ingestion theo loại source.','Thiết kế bronze/raw layer có metadata để replay.','Xử lý idempotency, retry, schema evolution, watermark/checkpoint.','Biết quan sát ingestion bằng lag, row count, failure và freshness.'],
    detail:`<h3>Ingestion không chỉ là lấy data</h3><p>Ingestion tốt giữ được dữ liệu raw, biết đã xử lý đến đâu, có thể chạy lại, và phát hiện sớm khi source đổi schema. Đây là nơi nhiều project portfolio yếu vì chỉ viết một script API rồi load thẳng vào mart.</p><table><tr><th>Source</th><th>Pattern</th><th>Key control</th><th>Raw path</th></tr><tr><td>orders/payments</td><td>CDC</td><td>LSN/updated_at, dedup key</td><td>raw/postgres/orders/date=...</td></tr><tr><td>inventory.csv</td><td>Batch file</td><td>file checksum, load date</td><td>raw/files/inventory/date=...</td></tr><tr><td>refund API</td><td>API incremental</td><td>cursor, rate limit, backoff</td><td>raw/api/refunds/date=...</td></tr><tr><td>clickstream</td><td>Kafka events</td><td>topic/partition/offset, DLQ</td><td>raw/events/clickstream/hour=...</td></tr></table><h3>Bronze contract</h3><div class="cmd-block"><div class="cmd-header"><div class="cmd-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div><span>ingestion/bronze_contract.sql</span></div><div class="cmd-body"><pre><span class="comment">-- Mỗi raw record cần đủ metadata để debug và replay</span>
raw_payload
source_system
ingested_at
source_updated_at
batch_id
schema_version
record_hash
is_deleted</pre></div></div><h3>Retry, checkpoint và replay</h3><ul><li><strong>Retry:</strong> retry transient error với exponential backoff, không retry vô hạn khi schema breaking.</li><li><strong>Idempotency:</strong> dùng natural key + source updated_at + record_hash, hoặc partition overwrite cho batch file.</li><li><strong>Watermark:</strong> lưu mốc cuối đã xử lý theo source, không hard-code trong script.</li><li><strong>DLQ:</strong> event lỗi schema đi vào dead-letter topic/table để inspect, không làm chết toàn bộ stream.</li></ul><div class="info-box warn">⚠️ <span>Anti-pattern: không có replay strategy. Nếu transform sai trong 3 ngày, bạn phải có raw data và checkpoint để rebuild silver/gold thay vì sửa tay dashboard.</span></div>`,
    summary:['Mỗi source cần ingestion pattern riêng: batch, CDC, API, streaming.','Bronze/raw giữ payload và metadata để replay/debug.','Idempotency bảo vệ pipeline khỏi duplicate khi retry hoặc backfill.','Watermark/checkpoint là trạng thái vận hành, không phải biến hard-code.','Observability ingestion cần rows, lag, failure, schema drift, freshness.','Không có replay strategy là lỗi thiết kế nghiêm trọng.'],
    practices:[['Ingestion strategy matrix','Lập bảng cho 4 source của NHC Commerce: pattern, frequency, key, watermark, retry, failure action.','Orders dùng CDC theo updated_at/LSN; API refund dùng cursor; inventory dùng file checksum; events dùng Kafka offset và DLQ.'],['Replay design','Mô tả cách rebuild gold marts từ raw khi phát hiện duplicate payment trong 2 ngày.','Pause dashboard nếu impact cao, fix silver dedup, backfill partition 2 ngày, chạy dbt tests, compare revenue before/after, ghi incident note.']]
  },
  {
    no:'W24.04', title:'Storage & Transformation Layer', tag:'Tuần 24 · W24.04', key:'transform',
    subtitle:'Tổ chức bronze/silver/gold, dbt-style transformations, fact/dimension modeling, data quality và orchestration flow.',
    menu:[['Storage','Raw object storage + curated warehouse tables.'],['Transform','staging → intermediate → marts theo dbt pattern.'],['Modeling','dim_customer, dim_product, fct_orders, fct_payments, fct_web_sessions.'],['Quality','Unique, not null, relationship, freshness, revenue reconciliation.']],
    objectives:['Thiết kế bronze/silver/gold và staging/intermediate/marts.','Định nghĩa grain cho fact/dimension.','Chọn partitioning theo query pattern và backfill.','Gắn data quality vào orchestration trước khi serving.'],
    detail:`<h3>Layering để giảm hỗn loạn</h3><p>Bronze giữ raw. Silver chuẩn hóa kiểu dữ liệu, dedup, join key và contract. Gold biến dữ liệu thành mart có grain rõ, metric nhất quán và dùng được cho BI. Nếu business logic nằm rải rác ở dashboard, project sẽ khó debug và khó phỏng vấn.</p><table><tr><th>Layer</th><th>Ví dụ NHC Commerce</th><th>Rule</th></tr><tr><td>Staging</td><td>stg_orders, stg_payments, stg_events</td><td>1:1 với source, rename/cast nhẹ</td></tr><tr><td>Intermediate</td><td>int_order_payments_deduped, int_sessions</td><td>Business logic dùng lại</td></tr><tr><td>Marts</td><td>fct_orders, dim_customer, mart_daily_revenue</td><td>BI-ready, tested, documented</td></tr></table><h3>Modeling sketch</h3><div class="cmd-block"><div class="cmd-header"><div class="cmd-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div><span>transformations/marts/fct_orders.sql</span></div><div class="cmd-body"><pre><span class="comment">-- Grain: one row per order_id</span>
order_key
customer_key
product_count
gross_amount
discount_amount
net_amount
payment_status
order_created_at
order_date</pre></div></div><h3>Partitioning và compute</h3><ul><li>Partition fact lớn theo <code>order_date</code> hoặc <code>event_date</code> vì backfill và dashboard thường lọc theo ngày.</li><li>Spark dùng cho historical event rebuild hoặc join lớn; dbt SQL đủ tốt cho marts warehouse hằng ngày.</li><li>Flink dùng cho sessionization near-real-time nếu cần event-time, watermark và state.</li><li>Airflow orchestrate: ingest → source freshness → staging → intermediate → marts → tests → publish dashboard flag.</li></ul><div class="info-box tip">✅ <span>Đặt metric logic ở mart hoặc semantic layer. Dashboard chỉ visualize, không tự tính revenue khác nhau ở mỗi chart.</span></div><div class="info-box warn">⚠️ <span>Anti-pattern: revenue definition bị copy-paste trong dbt model, notebook analyst và dashboard SQL. Một lỗi refund sẽ phải sửa ở nhiều nơi và vẫn dễ lệch.</span></div>`,
    summary:['Bronze/Silver/Gold giúp tách raw, cleaned và business-ready data.','dbt pattern làm rõ lineage, tests, docs và dependency.','Fact grain là hợp đồng quan trọng nhất của model.','Partition theo date giúp backfill, pruning và cost control.','Spark/Flink chỉ dùng khi volume/latency/state thật sự cần.','Business logic duplicate là nguồn sai lệch metric phổ biến.'],
    practices:[['Warehouse modeling','Thiết kế star schema cho executive dashboard NHC Commerce.','Facts: fct_orders, fct_payments, fct_web_sessions. Dimensions: dim_customer SCD2, dim_product, dim_date, dim_campaign. Marts: mart_daily_revenue, mart_funnel_daily.'],['Orchestration plan','Viết DAG steps từ ingestion đến publish mart với quality gate.','Tasks: ingest_cdc, ingest_api, load_events, dbt_source_freshness, dbt_build_staging, dbt_build_marts, dbt_test, revenue_reconcile, notify_success/failure.']]
  },
  {
    no:'W24.05', title:'Serving Layer: Warehouse, OLAP, KPI Dashboard', tag:'Tuần 24 · W24.05', key:'serving',
    subtitle:'Biến gold marts thành dashboard đáng tin: source-of-truth, certified metrics, semantic consistency, ownership và freshness.',
    menu:[['Warehouse serving','Executive finance/product dashboard từ gold marts.'],['OLAP serving','Operational checkout/payment dashboard từ event stream.'],['KPI layer','North Star, supporting metrics, guardrails và definitions.'],['Ownership','Metric owner, dashboard owner, freshness owner.']],
    objectives:['Thiết kế serving theo người dùng và latency.','Phân biệt executive vs operational dashboard.','Định nghĩa certified metrics và source-of-truth.','Tránh dashboard không rõ nguồn và metric lệch nhau.'],
    detail:`<h3>Serving layer là nơi dữ liệu bị hiểu sai nhiều nhất</h3><p>Nếu cùng một câu hỏi "doanh thu hôm qua bao nhiêu" có ba con số khác nhau, vấn đề không nằm ở chart. Vấn đề nằm ở semantic layer, metric ownership và source-of-truth.</p><table><tr><th>Dashboard</th><th>User</th><th>Source</th><th>Freshness</th><th>Owner</th></tr><tr><td>Executive Revenue</td><td>CEO/Finance</td><td>mart_daily_revenue</td><td>Daily 07:00</td><td>Analytics Engineer</td></tr><tr><td>Checkout Ops</td><td>Operations</td><td>ClickHouse events</td><td>5 phút</td><td>Data Engineer</td></tr><tr><td>Marketing Funnel</td><td>Marketing</td><td>mart_funnel_daily</td><td>Hourly/Daily</td><td>Analyst</td></tr></table><h3>Certified metrics</h3><div class="cmd-block"><div class="cmd-header"><div class="cmd-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div><span>warehouse/metrics.yml</span></div><div class="cmd-body"><pre>net_revenue:
 definition: gross_amount - discount_amount - refunded_amount
 grain: order_date, channel, category
 source: mart_daily_revenue
 owner: finance_analytics
 freshness_sla: daily before 07:00
 tests: non_negative, reconciled_with_payments</pre></div></div><h3>Executive vs operational</h3><ul><li><strong>Executive:</strong> ít chart, metric được certify, trend rõ, dùng cho quyết định chiến lược.</li><li><strong>Operational:</strong> latency thấp, drill-down theo service/channel/error type, phục vụ xử lý incident.</li><li><strong>Exploratory:</strong> cho analyst tự khám phá nhưng vẫn dựa trên marts đáng tin.</li></ul><div class="info-box warn">⚠️ <span>Anti-pattern: dashboard có SQL riêng join raw tables, không owner, không freshness, không metric definition. Nó có thể đẹp nhưng không đáng tin.</span></div>`,
    summary:['Serving bắt đầu từ người dùng, decision và latency.','Warehouse phù hợp governed BI; OLAP phù hợp operational event analytics.','Certified metric phải có definition, source, owner, freshness và tests.','Executive dashboard cần ít nhưng đúng; operational dashboard cần nhanh và actionable.','Semantic consistency tránh nhiều định nghĩa revenue/conversion.','Dashboard không source-of-truth là rủi ro business.'],
    practices:[['KPI framework','Định nghĩa North Star và 8 metric hỗ trợ cho NHC Commerce.','North Star: paid orders with positive margin. Supporting: GMV, net revenue, paid conversion, refund rate, stockout rate, fulfillment SLA, checkout success, repeat purchase rate.'],['Dashboard ownership','Tạo bảng owner/freshness/source cho 3 dashboard.','Ghi rõ dashboard owner, mart owner, alert channel, SLA, link runbook khi stale.']]
  },
  {
    no:'W24.06', title:'Reliability, Observability & Operations', tag:'Tuần 24 · W24.06', key:'ops',
    subtitle:'Thiết kế vận hành sau deploy: freshness, failures, lag, cost, quality, lineage, incident, runbook, SLA/SLO/SLI và post-mortem.',
    menu:[['Monitoring','Freshness, failures, lag, cost, quality.'],['Incident','Triage, impact analysis, mitigation, communication.'],['Runbooks','Step-by-step cho pipeline fail, schema drift, stale dashboard.'],['Culture','Ownership, on-call, blameless post-mortem.']],
    objectives:['Biết monitor data platform theo SLI cụ thể.','Viết runbook actionable cho incident thật.','Phân biệt SLA, SLO, SLI trong data context.','Thực hành impact analysis bằng lineage và ownership.'],
    detail:`<h3>Production không kết thúc ở deploy</h3><p>Data platform chỉ đáng tin khi có người biết nó đang khỏe hay hỏng, dashboard nào bị ảnh hưởng, và xử lý thế nào. Week23 maintenance được đưa thẳng vào capstone để chứng minh bạn hiểu ownership.</p><p><strong>CI/CD là một phần của reliability:</strong> mọi thay đổi dbt model, DAG, data quality rule hoặc Terraform plan nên đi qua pull request. Pipeline CI chạy SQL lint, dbt compile/test, unit tests và terraform plan trước khi merge vào <code>main</code>; deploy bằng Git thay vì copy file thủ công lên server.</p><table><tr><th>Signal</th><th>SLI</th><th>Alert khi</th><th>Owner</th></tr><tr><td>Freshness</td><td>max(order_date) age</td><td>mart_daily_revenue chưa cập nhật trước 07:00</td><td>AE</td></tr><tr><td>Failures</td><td>Airflow task failed</td><td>dbt_test hoặc ingestion fail</td><td>DE</td></tr><tr><td>Lag</td><td>Kafka consumer lag</td><td>lag > 10 phút</td><td>DE</td></tr><tr><td>Quality</td><td>Revenue reconciliation delta</td><td>delta > 0.5%</td><td>Finance analytics</td></tr><tr><td>Cost</td><td>Warehouse spend/query</td><td>daily cost > budget 30%</td><td>Platform owner</td></tr><tr><td>CI/CD</td><td>build/test/plan status</td><td>main branch pipeline failed hoặc terraform plan có drift</td><td>Platform owner</td></tr></table><h3>Runbook mẫu</h3><div class="cmd-block"><div class="cmd-header"><div class="cmd-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div><span>runbooks/dashboard_stale.md</span></div><div class="cmd-body"><pre>Symptom: Executive Revenue Dashboard stale after 07:00
 Check Airflow DAG ecommerce_daily_marts
 Check dbt source freshness for orders/payments
 If ingestion failed: rerun source task with same batch_id
 If dbt test failed: inspect failing model and impacted dashboards
 Communicate: #data-alerts + Finance owner
 Mitigate: mark dashboard stale, pause decision email
 After fix: backfill partition, rerun tests, post incident note</pre></div></div><h3>SLA/SLO/SLI</h3><ul><li><strong>SLI:</strong> số đo, ví dụ mart freshness minutes, test pass rate, lag seconds.</li><li><strong>SLO:</strong> mục tiêu nội bộ, ví dụ 99% ngày mart sẵn sàng trước 07:00.</li><li><strong>SLA:</strong> cam kết với stakeholder, ví dụ Finance dashboard available before 07:30 business days.</li></ul><div class="info-box warn">⚠️ <span>Anti-pattern: deploy xong không owner, không alert, không runbook. Khi dashboard sai, cả team tranh luận bằng cảm giác thay vì bằng lineage và evidence.</span></div>`,
    summary:['Reliability phải có SLI đo được, không chỉ nói ổn định.','Monitoring cần freshness, failures, lag, quality và cost.','Runbook phải actionable, có lệnh kiểm tra, owner và escalation.','Lineage giúp xác định dashboard và stakeholder bị ảnh hưởng.','Post-mortem tốt là blameless và có action item cụ thể.','Không có ownership sau deploy là anti-pattern production.'],
    practices:[['Incident handling','Mô phỏng incident: payment API trả duplicate refund trong 3 giờ. Viết impact analysis và mitigation.','Impact: net revenue thấp sai, refund rate tăng. Mitigation: freeze dashboard, dedup by refund_id+updated_at, backfill affected partitions, validate reconciliation, publish post-mortem.'],['Runbook writing','Viết runbook cho Kafka lag vượt 10 phút trong checkout events.','Include: check broker/consumer health, consumer group lag, DLQ volume, scale consumer, replay from offset, notify ops dashboard owner.']]
  },
  {
    no:'W24.07', title:'Portfolio, Documentation & Interview Storytelling', tag:'Tuần 24 · W24.07', key:'portfolio',
    subtitle:'Đóng gói capstone thành repo recruiter-grade: README, diagram, screenshots, trade-offs, scaling, failures learned và interview story.',
    menu:[['GitHub repo','Clean structure, README rõ, screenshots có caption.'],['Documentation','Architecture, data model, orchestration, monitoring, runbook.'],['Storytelling','Problem → constraints → design → trade-offs → incident → impact.'],['Review','Recruiter cần thấy maturity, không chỉ code chạy local.']],
    objectives:['Viết README capstone có business và kỹ thuật cân bằng.','Chuẩn bị architecture explanation và interview notes.','Biết recruiter thực sự quan tâm điều gì.','Tránh kiến trúc quá lớn nhưng không giải thích được.'],
    detail:`<h3>Portfolio là bằng chứng giao tiếp kỹ thuật</h3><p>Một repo tốt giúp người đọc hiểu vấn đề trước khi đọc code. Bạn cần chứng minh: tại sao hệ thống này tồn tại, dữ liệu đi thế nào, quyết định nào đã cân nhắc, lỗi nào đã gặp, và business nhận được gì.</p><table><tr><th>README section</th><th>Nội dung cần có</th></tr><tr><td>Business problem</td><td>NHC Commerce cần dashboard doanh thu, funnel, vận hành checkout</td></tr><tr><td>Architecture decisions</td><td>Batch cho finance correctness, streaming cho ops latency</td></tr><tr><td>Tooling choices</td><td>Airflow/dbt/warehouse/ClickHouse/Kafka theo requirement</td></tr><tr><td>Reliability</td><td>Tests, alerts, runbooks, incident example</td></tr><tr><td>Costs & trade-offs</td><td>Giới hạn scale, budget, future improvements</td></tr></table><h3>Interview storytelling template</h3><div class="cmd-block"><div class="cmd-header"><div class="cmd-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div><span>interview_notes.md</span></div><div class="cmd-body"><pre>1. Problem: finance and ops did not trust revenue/checkout metrics.
2. Constraints: team small, 80k orders/day, ops needs 5-min signals.
3. Design: CDC/API/batch/events into raw, dbt marts, warehouse + OLAP.
4. Trade-off: batch source of truth, stream fast but reconciled daily.
5. Failure: duplicate refund incident; fixed with dedup and backfill.

function escAttr(text) {
  return String(text).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function buildQuiz(key) {
  return baseQuizzes[key].map(q => {
    const opts = q[1].map((opt, idx) => {
      const correct = idx === q[2];
      const why = correct
        ? `Đúng. ${opt} là lựa chọn phù hợp với scenario capstone.`
        : `Sai. ${opt} không giải quyết đúng yêu cầu production hoặc business context của capstone.`;
      return `<div class="quiz-opt" onclick="answerQuiz(this, ${correct}, '${escAttr(why)}')">${'ABCD'[idx]}. ${opt}</div>`;
    }).join('');
    return `<div class="quiz-item"><div class="quiz-q">${q[0]}</div><div class="quiz-options">${opts}</div><div class="quiz-explain"></div></div>`;
  }).join('');
}

function buildSection(iconClass, icon, title, content, closed) {
  const style = closed ? ' style="display:none"' : '';
  const toggle = closed ? '▶' : '▼';
  return `<div class="section"><div class="section-header" onclick="toggleSection(this)"><div class="section-icon ${iconClass}">${icon}</div>${title}<span class="section-toggle">${toggle}</span></div><div class="section-content"${style}>${content}</div></div>`;
}

  const finalTest = m.finalTest ? buildFinalTest() : '';
  const prev = idx > 0 ? `<button class="nav-btn" onclick="goPrev(${idx})">← Module trước</button>` : `<span></span>`;

const modules = document.querySelectorAll('.module');
const navItems = document.querySelectorAll('.nav-item');

function showModule(idx, el) {
  modules.forEach(m => m.classList.remove('active'));
  navItems.forEach(n => n.classList.remove('active'));
  modules[idx].classList.add('active');
  if (el) el.classList.add('active');
  else if (navItems[idx]) navItems[idx].classList.add('active');
  window.scrollTo(0, 0);
}

function goNext(idx) {
  if (idx < modules.length - 1) showModule(idx + 1, navItems[idx + 1]);
}

function goPrev(idx) {
  if (idx > 0) showModule(idx - 1, navItems[idx - 1]);
}

function toggleSection(header) {
  const content = header.nextElementSibling;
  const toggle = header.querySelector('.section-toggle');
  const isHidden = content.style.display === 'none';
  content.style.display = isHidden ? 'block' : 'none';
  toggle.textContent = isHidden ? '▼' : '▶';
}

function answerQuiz(el, correct, explanation) {
  const item = el.closest('.quiz-item');
  const opts = item.querySelectorAll('.quiz-opt');
  const explain = item.querySelector('.quiz-explain');
  opts.forEach(o => o.style.pointerEvents = 'none');
  el.classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    opts.forEach(o => {
      if (o.getAttribute('onclick') && o.getAttribute('onclick').includes('true')) o.classList.add('correct');
    });
  }
  explain.textContent = (correct ? 'Chính xác. ' : 'Chưa đúng. ') + explanation;
  explain.classList.add('show');
}

function toggleSolution(btn) {
  const box = btn.nextElementSibling;
  const show = box.classList.toggle('show');
  btn.textContent = show ? 'Ẩn lời giải' : '💡 Xem lời giải';
}

function gradeFinalTest() {
  const questions = document.querySelectorAll('#final-test .test-question');
  const result = document.getElementById('final-test-result');
  let correctCount = 0, answeredCount = 0;
  const wrongAnswers = [], unanswered = [];
  questions.forEach(q => {
    const qNum = q.dataset.q;
    const correct = q.dataset.correct;
    const selected = q.querySelector(`input[name="q${qNum}"]:checked`);
    q.classList.remove('correct', 'wrong', 'unanswered');
    if (!selected) { q.classList.add('unanswered'); unanswered.push(qNum); return; }
    answeredCount++;
    if (selected.value === correct) { q.classList.add('correct'); correctCount++; }
    else { q.classList.add('wrong'); wrongAnswers.push({ q: qNum, selected: selected.value, correct }); }
  });
  const total = questions.length;
  const percent = Math.round((correctCount / total) * 100);
  let levelText = '', chipClass = 'warn', guidance = '';
  if (percent >= 90) { levelText = 'Rất mạnh'; chipClass = 'good'; guidance = 'Bạn đã sẵn sàng demo capstone và chuẩn bị mock interview.'; }
  else if (percent >= 80) { levelText = 'Sẵn sàng demo thử'; chipClass = 'good'; guidance = 'Hãy refine README, screenshots và interview_notes trước khi public.'; }
  else if (percent >= 60) { levelText = 'Cần gia cố'; chipClass = 'warn'; guidance = 'Hãy sửa các phần sai trong architecture, ops, serving hoặc portfolio artifact.'; }
  else { levelText = 'Chưa nên public'; chipClass = 'bad'; guidance = 'Quay lại W24.02-W24.08, đặc biệt là trade-off, quality gate, monitoring và runbook.'; }
  const unansweredHtml = unanswered.length ? `<p><strong>Câu chưa trả lời:</strong> Q${unanswered.join(', Q')}</p>` : '';
  const wrongHtml = wrongAnswers.length ? `<p><strong>Câu sai:</strong></p><ul>${wrongAnswers.map(i => `<li>Q${i.q}: bạn chọn <strong>${i.selected}</strong>, đáp án đúng <strong>${i.correct}</strong></li>`).join('')}</ul>` : '<p><strong>Tất cả câu đã trả lời đều đúng.</strong></p>';
  result.innerHTML = `<div class="score-row"><span class="score-chip ${chipClass}">Điểm: ${correctCount}/${total}</span><span class="score-chip">Tỷ lệ: ${percent}%</span><span class="score-chip ${chipClass}">Mức: ${levelText}</span><span class="score-chip">Đã trả lời: ${answeredCount}/${total}</span></div><p>${guidance}</p>${unansweredHtml}${wrongHtml}`;
  result.style.display = 'block';
  result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function resetFinalTest() {
  const questions = document.querySelectorAll('#final-test .test-question');
  const result = document.getElementById('final-test-result');
  questions.forEach(q => {
    q.classList.remove('correct', 'wrong', 'unanswered');
    q.querySelectorAll('input[type="radio"]').forEach(i => i.checked = false);
  });
  result.style.display = 'none';
  result.innerHTML = '';
}
</script>
</body>
