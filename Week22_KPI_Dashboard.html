<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<title>DE Handbook · Tuần 22 · KPI, Experimentation & Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --accent3: #f78166;
    --accent4: #d2a8ff;
    --accent5: #ffa657;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --code-bg: #0d1117;
    --highlight: #388bfd26;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
  .hero { background: linear-gradient(135deg, #0d1117 0%, #161b22 48%, #1f2a3d 100%); border-bottom: 2px solid var(--accent); padding: 42px 24px 32px; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, #1f6feb33, transparent 70%); pointer-events: none; }
  .hero h1 { position: relative; font-size: 2rem; font-weight: 800; color: var(--accent); letter-spacing: 0; }
  .hero p { position: relative; color: var(--text-muted); margin-top: 8px; font-size: 0.95rem; }
  .badge-row { position: relative; display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; border: 1px solid; }
  .badge-blue { color: var(--accent); border-color: var(--accent); background: #1f6feb1a; }
  .badge-green { color: var(--accent2); border-color: var(--accent2); background: #2ea04326; }
  .badge-orange { color: var(--accent5); border-color: var(--accent5); background: #d2940026; }
  .container { display: flex; min-height: calc(100vh - 160px); }
  .sidebar { width: 330px; min-width: 330px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .sidebar-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); padding: 0 16px 12px; }
  .level-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 8px 16px 4px; color: var(--accent2); }
  .nav-item { display: block; padding: 8px 16px; cursor: pointer; font-size: 0.82rem; color: var(--text-muted); border-left: 3px solid transparent; transition: all 0.15s; text-decoration: none; }
  .nav-item:hover { color: var(--text); background: var(--surface2); }
  .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--highlight); font-weight: 600; }
  .nav-number { display: inline-block; width: 58px; font-size: 0.7rem; color: var(--text-muted); font-family: Consolas, 'Courier New', monospace; }
  .main { flex: 1; padding: 32px 40px; max-width: 1040px; }
  .module { display: none; }
  .module.active { display: block; }
  .module-header { border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px; background: var(--surface); margin-bottom: 24px; position: relative; overflow: hidden; }
  .module-header::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .module-tag { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 8px; }
  .module-title { font-size: 1.55rem; font-weight: 800; margin-bottom: 8px; }
  .module-subtitle { color: var(--text-muted); font-size: 0.9rem; }
  .progress-bar { background: var(--surface2); border-radius: 4px; height: 4px; margin: 16px 0; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; }
  .section { margin-bottom: 28px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .section-header { padding: 14px 20px; font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; cursor: pointer; background: var(--surface2); border-bottom: 1px solid var(--border); user-select: none; }
  .section-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .icon-purpose { background: #1f6feb33; }
  .icon-detail { background: #2ea04326; }
  .icon-quiz { background: #d2940026; }
  .icon-summary { background: #6e40c926; }
  .icon-practice { background: #f7816626; }
  .section-content { padding: 20px; background: var(--surface); }
  .section-toggle { margin-left: auto; color: var(--text-muted); font-size: 12px; }
  h3 { font-size: 1rem; font-weight: 700; color: var(--accent); margin: 18px 0 10px; }
  h3:first-child { margin-top: 0; }
  p { margin-bottom: 12px; color: var(--text); font-size: 0.88rem; }
  ul, ol { padding-left: 20px; margin-bottom: 12px; }
  li { font-size: 0.88rem; margin-bottom: 5px; }
  strong { color: var(--text); }
  code { font-family: Consolas, 'Courier New', monospace; background: var(--surface2); border: 1px solid var(--border); padding: 1px 6px; border-radius: 4px; font-size: 0.82rem; color: var(--accent4); }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.83rem; }
  th { background: var(--surface2); padding: 8px 12px; text-align: left; border: 1px solid var(--border); color: var(--accent); }
  td { padding: 8px 12px; border: 1px solid var(--border); vertical-align: top; }
  tr:nth-child(even) td { background: #ffffff05; }
  .cmd-block { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; margin: 12px 0; overflow: hidden; }
  .cmd-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: var(--surface2); border-bottom: 1px solid var(--border); font-size: 0.72rem; color: var(--text-muted); font-family: Consolas, 'Courier New', monospace; }
  .cmd-dots { display: flex; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-red { background: #f7816680; }
  .dot-yellow { background: #ffa65780; }
  .dot-green { background: #3fb95080; }
  .cmd-body { padding: 14px; }
  pre { font-family: Consolas, 'Courier New', monospace; font-size: 0.82rem; line-height: 1.6; white-space: pre; overflow-x: auto; color: var(--text); }
  .prompt { color: var(--accent2); }
  .comment { color: var(--text-muted); }
  .output { color: var(--accent5); }
  .info-box { border-radius: 8px; padding: 14px 16px; margin: 12px 0; font-size: 0.84rem; border: 1px solid; display: flex; gap: 10px; }
  .info-box.tip { border-color: var(--accent2); background: #2ea04310; color: var(--accent2); }
  .info-box.warn { border-color: var(--accent5); background: #d2940015; color: var(--accent5); }
  .info-box.note { border-color: var(--accent); background: #1f6feb15; color: var(--accent); }
  .info-box span { color: var(--text); }
  .quiz-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .quiz-q { font-weight: 600; font-size: 0.88rem; margin-bottom: 10px; }
  .quiz-q::before { content: 'Q'; display: inline-block; width: 22px; height: 22px; background: var(--accent); color: #000; border-radius: 50%; font-size: 0.7rem; font-weight: 800; text-align: center; line-height: 22px; margin-right: 8px; }
  .quiz-options { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .quiz-opt { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.84rem; transition: all 0.15s; background: var(--bg); }
  .quiz-opt:hover { border-color: var(--accent); color: var(--accent); }
  .quiz-opt.correct { border-color: var(--accent2); color: var(--accent2); background: #2ea04310; }
  .quiz-opt.wrong { border-color: var(--accent3); color: var(--accent3); background: #f7816610; }
  .quiz-explain { font-size: 0.82rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 10px; margin-top: 8px; display: none; }
  .quiz-explain.show { display: block; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .summary-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 0.82rem; }
  .summary-item strong { color: var(--accent); display: block; margin-bottom: 4px; }
  .practice-task { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .practice-task-header { padding: 12px 16px; background: #d2940015; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 0.85rem; color: var(--accent5); }
  .practice-task-body { padding: 16px; }
  .solution-toggle { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; font-size: 0.8rem; cursor: pointer; color: var(--accent2); margin-top: 10px; transition: all 0.15s; }
  .solution-toggle:hover { background: var(--surface2); }
  .solution-box { margin-top: 10px; display: none; border-top: 1px solid var(--border); padding-top: 12px; }
  .solution-box.show { display: block; }
  .nav-buttons { display: flex; gap: 12px; margin-top: 32px; justify-content: space-between; }
  .nav-btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn.primary { background: var(--accent); color: #000; border-color: var(--accent); }
  .test-question { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; }
  .test-question.correct { border-color: var(--accent2); background: #2ea04312; }
  .test-question.wrong { border-color: var(--accent3); background: #f7816612; }
  .test-question.unanswered { border-color: var(--accent5); background: #d2940015; }
  .test-question-title { font-size: 0.86rem; font-weight: 600; margin-bottom: 8px; }
  .test-options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  .test-option { display: flex; align-items: center; gap: 6px; font-size: 0.83rem; color: var(--text); }
  .test-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .test-result { margin-top: 16px; padding: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface2); }
  .score-chip { border: 1px solid var(--border); border-radius: 14px; padding: 4px 10px; font-size: 0.78rem; color: var(--text); background: var(--bg); display: inline-block; margin: 0 6px 8px 0; }
  .score-chip.good { border-color: var(--accent2); color: var(--accent2); }
  .score-chip.warn { border-color: var(--accent5); color: var(--accent5); }
  .score-chip.bad { border-color: var(--accent3); color: var(--accent3); }
  .callout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 12px 0; }
  .mini-card { border: 1px solid var(--border); border-radius: 8px; background: var(--surface2); padding: 12px; font-size: 0.84rem; }
  .mini-card strong { display: block; color: var(--accent); margin-bottom: 4px; }
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { padding: 16px; }
    .hero h1 { font-size: 1.55rem; }
    .summary-grid, .test-options, .callout-grid { grid-template-columns: 1fr; }
    .nav-buttons { flex-direction: column; }
  }
</style>
</head>

<script>
const labels = ['A','B','C','D'];
const moduleTitles = [
  ['W22.01','Tổng Quan: KPI, Metrics & Decision-Making'],
  ['W22.02','North Star Metric, Supporting Metrics & Guardrails'],
  ['W22.03','Metric Definitions, Ownership & Data Trust'],
  ['W22.04','Dashboard Design: Executive vs Operational vs Exploratory'],
  ['W22.05','A/B Testing Fundamentals cho Data Engineer'],

  ['W22.07','Artifact: week22_kpi_dashboard/'],
  ['W22.08','Mini Test Tổng Kết']
];
const quizBank = [
  [
    ['Một KPI tốt khác metric thông thường ở điểm nào?', ['KPI gắn với quyết định và mục tiêu kinh doanh cụ thể','KPI luôn là số tiền','KPI chỉ cần chart đẹp','KPI không cần owner'], 0, ['Đúng. KPI phải giúp quyết định hành động, không chỉ đo cho biết.','Sai. Revenue là KPI phổ biến nhưng không phải KPI nào cũng là tiền.','Sai. Chart đẹp không cứu được metric sai định nghĩa.','Sai. KPI production cần owner rõ ràng.']],
    ['Vì sao dashboard hay thất bại khi metric definition mơ hồ?', ['Vì BI tool không đủ mạnh','Vì mỗi team có thể tính cùng một KPI theo cách khác nhau','Vì chart trend không hữu ích','Vì dashboard không nên có KPI'], 1, ['Sai. Tool mạnh vẫn sai nếu định nghĩa sai.','Đúng. Mâu thuẫn definition phá vỡ trust và làm cuộc họp xoay quanh tranh cãi số.','Sai. Trend hữu ích khi metric đáng tin.','Sai. Dashboard quyết định thường cần KPI.']],
    ['Measure là gì trong chuỗi measure → metric → KPI?', ['Số đo thô như order_count hoặc revenue_amount','Mục tiêu chiến lược của công ty','Dashboard cuối cùng','Experiment result'], 0, ['Đúng. Measure là raw quantity trước khi được đặt ngữ cảnh.','Sai. Đó gần với KPI hoặc strategic goal.','Sai. Dashboard là bề mặt tiêu thụ dữ liệu.','Sai. Experiment dùng metrics để đọc tác động.']],
    ['Decision-first dashboard bắt đầu bằng gì?', ['Chọn chart type','Chọn màu brand','Câu hỏi business và quyết định cần đưa ra','Export toàn bộ table'], 2, ['Sai. Chart type đến sau câu hỏi.','Sai. Màu không quyết định business action.','Đúng. Câu hỏi → metric → dataset → dashboard là flow đúng.','Sai. Dump table không phải dashboard ra quyết định.']],
    ['Vanity metric là metric như thế nào?', ['Dễ tăng nhưng không chỉ ra hành động hoặc giá trị thật','Luôn sai về mặt SQL','Luôn là metric marketing','Metric có denominator'], 0, ['Đúng. Page views cao có thể vô nghĩa nếu không nối với activation/conversion.','Sai. SQL có thể đúng nhưng business value yếu.','Sai. Vanity metric có ở nhiều domain.','Sai. Denominator thường làm metric tốt hơn.']],
    ['Vì sao Data Engineer phải quan tâm KPI definition?', ['DE chỉ cần ingest data','Vì model, freshness, filter và lineage quyết định KPI có đáng tin không','Vì dashboard là việc của designer','Vì stakeholder tự sửa được SQL'], 1, ['Sai. Ingest đúng schema chưa đủ để metric đúng.','Đúng. DE kiểm soát nền tảng làm metric reproducible và auditable.','Sai. Dashboard data product cần DE tham gia.','Sai. SQL tự phát là nguồn gây lệch KPI.']],
    ['Ví dụ nào là actionable metric tốt hơn?', ['Total registered users mọi thời gian','Activation rate D7 theo acquisition channel','Số lượt mở app lifetime','Tổng số chart trong dashboard'], 1, ['Sai. Lifetime total dễ tăng nhưng khó hành động.','Đúng. Có denominator, time window và breakdown để quyết định channel.','Sai. Cần nối với retention/conversion để hành động.','Sai. Số chart không đo business.']],
    ['SLA trong dashboard data product thường dùng để đo gì?', ['Độ tươi và độ tin cậy vận hành của dữ liệu/dashboard','Màu của KPI card','Số lượng nhân viên trong team','Giá license BI'], 0, ['Đúng. Ví dụ dashboard phải refresh trước 8:00 với completeness > 99%.','Sai. Màu là UX, không phải SLA.','Sai. Staffing không phải SLA metric.','Sai. Cost quan trọng nhưng không phải SLA definition.']],
    ['Flow đúng khi xây dashboard là gì?', ['Dataset → chart → câu hỏi → metric','Business question → metric → dataset → dashboard','Chart → màu → metric → source','Dashboard → stakeholder → SQL'], 1, ['Sai. Dataset-first dễ dẫn đến chart có sẵn nhưng vô dụng.','Đúng. Đây là mindset decision-first.','Sai. Thiết kế bắt đầu từ quyết định, không từ chart.','Sai. Stakeholder input phải có trước dashboard.']],
    ['Outcome tốt nhất của tuần này là gì?', ['Biết nhiều loại chart','Xây artifact KPI/dashboard có definition, query, quality checks và recommendation','Thuộc p-value công thức','Tạo dashboard một trang cho mọi người'], 1, ['Sai. Chart chỉ là phương tiện.','Đúng. Portfolio-grade artifact phải chứng minh decision quality và data trust.','Sai. Intuition thống kê quan trọng hơn học vẹt công thức.','Sai. Một dashboard cho mọi người là anti-pattern.']]
  ],
  [
    ['North Star Metric nên đại diện cho điều gì?', ['Giá trị cốt lõi người dùng nhận được và business muốn tăng bền vững','Metric dễ kéo lên nhất','Metric do CEO thích nhất','Tất cả revenue của công ty'], 0, ['Đúng. NSM tốt nằm giữa user value và business health.','Sai. Dễ kéo lên có thể là vanity metric.','Sai. Cần logic sản phẩm, không chỉ sở thích.','Sai. Revenue quan trọng nhưng đôi khi là lagging metric.']],
    ['Supporting metric dùng để làm gì?', ['Thay thế hoàn toàn North Star','Giải thích driver phía sau North Star','Chỉ để trang trí dashboard','Ẩn guardrail metric'], 1, ['Sai. Supporting metric bổ trợ, không thay thế.','Đúng. Chúng giúp biết phải kéo đòn bẩy nào.','Sai. Metric nào lên dashboard cũng cần mục đích.','Sai. Guardrail phải hiện rõ khi quyết định có rủi ro.']],
    ['Leading indicator khác lagging indicator thế nào?', ['Leading phản ứng sớm hơn outcome cuối, lagging xác nhận kết quả sau','Leading luôn chính xác hơn','Lagging không bao giờ dùng','Leading chỉ dùng cho finance'], 0, ['Đúng. Activation có thể leading cho retention; revenue thường lagging.','Sai. Leading nhanh nhưng có thể nhiễu.','Sai. Lagging dùng để xác nhận giá trị thật.','Sai. Mọi domain đều có leading indicators.']],
    ['Guardrail metric có vai trò gì?', ['Tối đa hóa bằng mọi giá','Phát hiện tác động phụ khi tối ưu metric chính','Thay primary metric trong experiment','Chỉ dùng cho security'], 1, ['Sai. Guardrail thường là giới hạn không được làm xấu.','Đúng. Ví dụ tăng conversion nhưng không được tăng refund hoặc latency.','Sai. Primary và guardrail phục vụ mục đích khác nhau.','Sai. Guardrail dùng rộng trong product, data và ops.']],
    ['Metric tree giúp ích gì?', ['Biến mục tiêu cao cấp thành driver đo được và có owner','Tự động tạo dashboard đẹp','Loại bỏ nhu cầu SQL','Đảm bảo mọi metric đều tăng'], 0, ['Đúng. Tree cho thấy quan hệ NSM → input/output metrics.','Sai. Dashboard vẫn cần thiết kế.','Sai. Metric tree cần query implementation.','Sai. Có metric cần giữ ổn định như guardrail.']],

    sections:[
      '<table><tr><th>Thành phần</th><th>Cần ghi rõ</th><th>Rủi ro nếu thiếu</th></tr><tr><td>Definition</td><td>Numerator, denominator, grain</td><td>Double count, lệch denominator</td></tr><tr><td>Rules</td><td>Filters, timezone, late data</td><td>Số đổi không giải thích được</td></tr><tr><td>Governance</td><td>Owner, certification, lineage</td><td>Mỗi team tính một kiểu</td></tr></table>',
      '<ul><li>Viết metric definition document production-ready.</li><li>Hiểu tác động của grain, timezone, late-arriving data, bot/internal traffic exclusion.</li><li>Thiết kế ownership, certified metrics và Semantic Layer.</li><li>Nối source of truth từ data lineage đến dashboard.</li></ul>',
      '<h3>Metric definition document</h3>'+codeBlock('metric_definitions.md','# Metric: D7 Activation Rate\nPurpose: Đo chất lượng user mới sau signup.\nNumerator: users signup trong cohort day D và hoàn tất activation_event trong 7 ngày.\nDenominator: eligible users signup thành công trong cohort day D.\nGrain: signup_cohort_date x acquisition_channel.\nFilters: exclude internal_users, test_accounts, known_bots, deleted accounts.\nTimezone: cohort date theo Asia/Saigon; event timestamps lưu UTC.\nLate data: dashboard D-1 là preliminary; final sau 48 giờ lookback.\nOwner: Product Analytics. Data owner: Analytics Engineering.\nCertified source: mart_user_activation_daily.\nLineage: raw_events → stg_events → int_user_activation → mart_user_activation_daily → dashboard.')+'<h3>Semantic Layer: metric contract dạng code</h3><p>Markdown definition giúp con người hiểu metric, nhưng production thường cần một <strong>Semantic Layer</strong>: nơi metric được định nghĩa một lần bằng code/config rồi được BI tool, notebook và API dùng lại. Các hệ như dbt Semantic Layer/MetricFlow hoặc Cube.js giải quyết vấn đề “same KPI calculated differently” bằng versioning, tests, owner và review workflow.</p>'+codeBlock('semantic_layer.yml','semantic_models:\n  - name: user_activation\n    model: ref(\'mart_user_activation_daily\')\n    defaults:\n      agg_time_dimension: signup_date\n    entities:\n      - name: user\n        type: primary\n        expr: user_id\n    dimensions:\n      - name: acquisition_channel\n        type: categorical\n      - name: signup_date\n        type: time\n        type_params:\n          time_granularity: day\n      - name: is_internal_user\n        type: categorical\n    measures:\n      - name: eligible_signups\n        agg: sum\n      - name: activated_users_d7\n        agg: sum\n\nmetrics:\n  - name: d7_activation_rate\n    type: ratio\n    label: D7 Activation Rate\n    type_params:\n      numerator: activated_users_d7\n      denominator: eligible_signups\n    filter: |\n      {{ Dimension(\'user_activation__is_internal_user\') }} = false')+'<h3>Numerator, denominator và grain</h3><p>Phần lớn KPI sai vì denominator mơ hồ hoặc grain sai. Nếu activation rate tính ở user-day nhưng dashboard join với campaign table many-to-many, numerator có thể bị nhân đôi. DE phải kiểm soát grain trước khi expose metric.</p>'+info('tip','✅','Certified metrics nên nằm trong semantic/model layer có tests, docs và owner. Dashboard chỉ consume metric đã certified, không copy logic tính KPI rải rác.')+'<h3>Stakeholder review workflow</h3><p>Khi đổi logic metric đã certified, đừng sửa thẳng trong dashboard production. Flow tốt hơn: Data Engineer mở Pull Request đổi YAML/SQL metric → CI chạy dbt tests, freshness tests và sample metric diff → Data Analyst/Product Owner review business meaning → merge → dashboard consume version mới → release note giải thích thay đổi số.</p><h3>Late-arriving data và freshness</h3><p>Event log, attribution, payment reconciliation thường đến trễ. Dashboard nên phân biệt số preliminary và final. Một rule production tốt: refresh hourly cho operational dashboard, nhưng KPI executive hôm qua chỉ final sau 48 giờ nếu late data historically đáng kể.</p><h3>Same KPI calculated differently</h3><p>Anti-pattern nguy hiểm nhất là Finance, Product và Sales đều có “Revenue” riêng: gross revenue, net revenue, recognized revenue. Không có definition thì mọi cuộc họp biến thành tranh luận con số thay vì quyết định.</p>',
      quizHtml(2),
      summary([['Definition','Ghi rõ numerator, denominator, grain, filters, timezone.'],['Owner','Có người chịu trách nhiệm business meaning và change control.'],['Certified','Metric đã được review, test và chấp nhận làm source of truth.'],['Lineage','Biết source, model và dashboard bị ảnh hưởng khi thay đổi.'],['Late data','Cần lookback, watermark và trạng thái preliminary/final.'],['Trust','Không có trust thì dashboard không tạo impact.']]),
      practice('Semantic Layer YAML task','<p>Viết cấu hình YAML kiểu dbt Semantic Layer cho metric <code>D7 Activation Rate</code>. Yêu cầu có measure numerator, measure denominator, ratio metric, grain theo cohort date và filter loại internal users.</p>', codeBlock('semantic_layer.yml','semantic_models:\n  - name: user_activation\n    model: ref(\'mart_user_activation_daily\')\n    defaults:\n      agg_time_dimension: signup_date\n    entities:\n      - name: user\n        type: primary\n        expr: user_id\n    dimensions:\n      - name: signup_date\n        type: time\n        type_params:\n          time_granularity: day\n      - name: acquisition_channel\n        type: categorical\n      - name: is_internal_user\n        type: categorical\n    measures:\n      - name: activated_users_d7\n        agg: sum\n      - name: eligible_signups\n        agg: sum\n\nmetrics:\n  - name: d7_activation_rate\n    type: ratio\n    label: D7 Activation Rate\n    type_params:\n      numerator: activated_users_d7\n      denominator: eligible_signups\n    filter: |\n      {{ Dimension(\'user_activation__is_internal_user\') }} = false'))+
      practice('Data quality check task','<p>Viết SQL kiểm tra duplicate exposure events theo experiment_id, user_id.</p>', codeBlock('data_quality_checks.sql','<span class="comment">-- Một user không nên có nhiều variant trong cùng experiment</span>\nSELECT experiment_id, user_id, COUNT(DISTINCT variant) AS variants\nFROM fact_experiment_exposure\nWHERE exposure_time >= CURRENT_DATE - INTERVAL \'30 days\'\nGROUP BY experiment_id, user_id\nHAVING COUNT(DISTINCT variant) > 1;'))
    ]
  },
  {
    subtitle:'Thiết kế dashboard theo audience và decision: executive summary, operational monitoring, exploratory analysis.',
    sections:[
      '<table><tr><th>Dashboard</th><th>User</th><th>Decision</th></tr><tr><td>Executive</td><td>Leadership</td><td>Business có ổn không, cần ưu tiên gì?</td></tr><tr><td>Operational</td><td>Ops/Data/Product on-call</td><td>Có incident không, xử lý ở đâu?</td></tr><tr><td>Exploratory</td><td>Analyst/Product</td><td>Nguyên nhân và segment nào tạo thay đổi?</td></tr></table>',
      '<ul><li>Phân biệt executive, operational và exploratory dashboard.</li><li>Thiết kế layout hierarchy, KPI cards, trend, breakdown và drill-down.</li><li>Thêm freshness, annotation, alert threshold và anomaly detection để tăng trust.</li><li>Hiểu Dashboard as Code để dashboard không trở thành cấu hình thủ công khó kiểm soát.</li><li>Tránh anti-pattern một dashboard cho tất cả mọi người.</li></ul>',
      '<h3>Dashboard users and decisions</h3><p>Dashboard tốt không hỏi “nên dùng chart gì?” trước. Nó hỏi “ai sẽ dùng, họ quyết định gì, họ cần độ trễ bao nhiêu, và nếu số xấu họ làm gì?”. Executive cần ít KPI và narrative. Operational cần threshold, freshness, alert. Exploratory cần filters và drill-down.</p><h3>Layout hierarchy</h3><ol><li>Header: scope, date range, freshness, owner.</li><li>KPI row: North Star, supporting, guardrail status.</li><li>Trend row: 8-12 tuần để thấy direction và seasonality.</li><li>Breakdown: channel, cohort, region, platform, plan.</li><li>Drill-down: link đến records/queries khi cần debug.</li></ol>'+codeBlock('dashboard_wireframe.md','Executive Dashboard\n[Freshness: updated 2026-05-16 08:05 UTC | Owner: Product Analytics]\n\nKPI Cards:\n- Weekly Activated Teams: 12,480 (+4.2% WoW, target +3%)\n- D7 Activation Rate: 38.4% (-1.1pp WoW)\n- Paid Conversion: 8.7% (+0.3pp WoW)\n- Guardrail: Support Tickets / 100 Teams = 4.8 (amber)\n\nCharts:\n1. North Star trend 12 weeks with launch annotations\n2. Activation funnel by acquisition channel\n3. Guardrail trend: latency, support tickets, churn\n4. Drill-down table: channels with high volume and low activation')+info('note','📌','Freshness indicator không phải chi tiết nhỏ. Nó cho biết người dùng có đang nhìn dữ liệu đủ mới để ra quyết định hôm nay không.')+'<h3>Alert threshold và anomaly detection</h3><p>Threshold tĩnh phù hợp khi business có ngưỡng rõ: payment success rate dưới 97% là incident. Nhưng nhiều KPI có seasonality. Khi revenue thứ Ba giảm 20% so với các thứ Ba gần nhất, anomaly detection có ích hơn threshold cứng vì nó so metric với baseline lịch sử cùng ngữ cảnh.</p>'+codeBlock('anomaly_alert.sql','<span class="comment">-- Alert nếu revenue hôm qua giảm hơn 20% so với trung bình cùng thứ trong 8 tuần trước</span>\nWITH daily AS (\n  SELECT order_date::date AS metric_date, SUM(net_revenue) AS revenue\n  FROM mart_orders_daily\n  WHERE order_date >= CURRENT_DATE - INTERVAL \'60 days\'\n  GROUP BY 1\n), baseline AS (\n  SELECT AVG(revenue) AS avg_same_weekday\n  FROM daily\n  WHERE EXTRACT(DOW FROM metric_date) = EXTRACT(DOW FROM CURRENT_DATE - INTERVAL \'1 day\')\n    AND metric_date < CURRENT_DATE - INTERVAL \'1 day\'\n), yesterday AS (\n  SELECT revenue\n  FROM daily\n  WHERE metric_date = CURRENT_DATE - INTERVAL \'1 day\'\n)\nSELECT\n  yesterday.revenue,\n  baseline.avg_same_weekday,\n  CASE WHEN yesterday.revenue < baseline.avg_same_weekday * 0.8 THEN \'ALERT\' ELSE \'OK\' END AS status\nFROM yesterday CROSS JOIN baseline;')+'<h3>Dashboard as Code / BI versioning</h3><p>Senior Analytics Engineering không coi dashboard production là cấu hình click tay không kiểm soát. Tối thiểu, query và metric definition phải vào Git; tốt hơn nữa là dashboard config hoặc exposure được version-control bằng LookML, Superset export, Metabase API export, dbt exposures hoặc tài liệu wireframe có review. Mục tiêu là biết ai đổi chart nào, đổi metric nào, và rollback được khi logic sai.</p><h3>Avoid chart clutter</h3><p>Không nhồi mọi dimension vào một dashboard. Nếu executive cần thấy “business health”, đừng bắt họ đọc 14 filters. Nếu ops cần xử lý incident, đừng chỉ cho họ monthly trend.</p>',
      quizHtml(3),
      summary([['Executive','Ít KPI, nhiều context, tập trung quyết định chiến lược.'],['Operational','Threshold, alert, freshness, drill-down cho hành động nhanh.'],['Exploratory','Filters và breakdown để phân tích nguyên nhân.'],['Hierarchy','KPI → trend → breakdown → detail.'],['Trust signals','Definition, owner, source, freshness, annotation.'],['Anti-pattern','Một dashboard cho mọi người thường không phục vụ ai tốt.']]),
      practice('Dashboard critique task','<p>Dashboard executive có 20 filters, 15 line charts, không có target. Hãy viết redesign proposal.</p>', '<p>Giữ 5 KPI cards chính, thêm target và WoW/YoY change; chỉ giữ 3 charts: North Star trend, funnel, guardrail trend; chuyển filters phức tạp sang exploratory dashboard; thêm freshness, owner, annotation launch/outage.</p>')+
      practice('Operational dashboard task','<p>Thiết kế operational dashboard cho payment success rate.</p>', '<p>KPI cards: success rate 15 phút, payment failures, p95 authorization latency, impacted users. Threshold: success rate < 97% red, latency > 2s amber. Breakdowns: provider, country, payment method, app version. Drill-down: recent failed transactions masked PII. Freshness: updated every 5 minutes.</p>')
    ]
  },
  {
    subtitle:'A/B testing từ góc nhìn DE: hypothesis, allocation, metric design, logging và interpretation căn bản.',
    sections:[
      '<table><tr><th>Thành phần</th><th>Câu hỏi</th><th>DE cần đảm bảo</th></tr><tr><td>Hypothesis</td><td>Thay đổi nào tạo effect nào?</td><td>Metric/event đo được cơ chế</td></tr><tr><td>Randomization</td><td>User vào group nào?</td><td>Assignment ổn định, không đổi variant</td></tr><tr><td>Logging</td><td>User có thấy treatment không?</td><td>Exposure, assignment, outcome events</td></tr></table>',
      '<ul><li>Hiểu control vs treatment, randomization và allocation.</li><li>Chọn primary metric và guardrail metric trước khi chạy.</li><li>Giải thích p-value, confidence interval, statistical vs practical significance ở mức beginner.</li><li>Biết logging requirements để experiment phân tích được.</li></ul>',
      '<h3>Experiment basics</h3><p>Experiment tốt bắt đầu bằng hypothesis rõ: nếu thay đổi onboarding checklist cho new users, D7 activation tăng vì user hiểu next action nhanh hơn. Control nhận trải nghiệm hiện tại. Treatment nhận thay đổi. Randomization giúp hai nhóm tương đương trước treatment.</p><h3>Randomization bằng hash salt</h3><p>Trong production, assignment thường dùng deterministic hash để cùng một user luôn nhận cùng một variant. Hãy dùng <code>experiment_id</code> làm salt khi hash <code>user_id</code>; nếu chỉ hash user_id, cùng một nhóm user có thể luôn rơi vào treatment trên nhiều experiments, tạo bias chéo.</p>'+codeBlock('experiment_assignment.sql','<span class="comment">-- Pseudocode SQL-style: dùng experiment_id làm salt để assignment độc lập giữa experiments</span>\nWITH candidates AS (\n  SELECT user_id, \'exp_onboarding_checklist_v2\' AS experiment_id\n  FROM dim_users\n  WHERE signup_date >= CURRENT_DATE - INTERVAL \'30 days\'\n    AND is_internal_user = FALSE\n), assigned AS (\n  SELECT\n    user_id,\n    experiment_id,\n    MOD(ABS(HASHTEXT(experiment_id || \':\' || user_id)), 100) AS bucket\n  FROM candidates\n)\nSELECT\n  user_id,\n  experiment_id,\n  CASE WHEN bucket < 50 THEN \'control\' ELSE \'treatment\' END AS variant\nFROM assigned;')+'<h3>Metric plan</h3><table><tr><th>Loại metric</th><th>Ví dụ</th><th>Lý do</th></tr><tr><td>Primary</td><td>D7 activation rate</td><td>Gắn trực tiếp hypothesis</td></tr><tr><td>Secondary</td><td>Checklist completion, project_created</td><td>Giải thích cơ chế</td></tr><tr><td>Guardrail</td><td>Support tickets, page latency, churn</td><td>Chặn tác động phụ</td></tr></table><h3>Sample size intuition</h3><p>Effect càng nhỏ, variance càng cao, baseline càng thấp thì cần sample càng lớn. Với conversion baseline 5%, muốn detect lift nhỏ 0.2 percentage point sẽ cần nhiều traffic hơn rất nhiều so với lift 2 percentage point.</p><h3>p-value và confidence interval</h3><p><strong>p-value</strong> không phải xác suất treatment đúng. Nó là xác suất thấy kết quả ít nhất cực đoan như dữ liệu quan sát nếu thật ra không có effect. <strong>Confidence interval</strong> giúp thấy uncertainty của lift. Một lift +1.0pp với CI [-0.2pp, +2.2pp] chưa chắc đáng ship.</p>'+codeBlock('experiment_logging.sql','<span class="comment">-- Events tối thiểu cho experiment analysis</span>\nCREATE TABLE fact_experiment_exposure (\n  experiment_id TEXT NOT NULL,\n  user_id TEXT NOT NULL,\n  variant TEXT NOT NULL,\n  exposure_time TIMESTAMP NOT NULL,\n  assignment_id TEXT NOT NULL,\n  exposure_surface TEXT NOT NULL,\n  PRIMARY KEY (experiment_id, user_id)\n);\n\nCREATE TABLE fact_activation_event (\n  user_id TEXT NOT NULL,\n  event_time TIMESTAMP NOT NULL,\n  activation_type TEXT NOT NULL\n);')+info('warn','⚠️','Log exposure khi user thực sự thấy component được render, không phải khi backend trả API. Nếu log quá sớm, denominator sẽ chứa user chưa bao giờ nhìn thấy treatment.')+info('warn','⚠️','Anti-pattern: peeking quá sớm. Nếu mỗi ngày nhìn p-value rồi declare winner khi vừa p < 0.05, false positive sẽ tăng mạnh.') ,
      quizHtml(4),
      summary([['Hypothesis','Nêu change, audience, metric và cơ chế kỳ vọng.'],['Control/Treatment','Baseline hiện tại và trải nghiệm mới.'],['Randomization','Giảm selection bias.'],['Primary metric','Predefine trước khi xem kết quả.'],['Guardrail','Theo dõi tác động phụ.'],['Logging','Exposure, assignment và outcome events là bắt buộc.']]),
      practice('Experiment design task','<p>Thiết kế experiment cho e-commerce: thêm one-click checkout cho users đã lưu thẻ.</p>', '<p>Hypothesis: one-click checkout giảm friction nên paid conversion tăng. Population: logged-in users có saved payment. Allocation: 50/50 sau ramp 10% nếu risk thấp. Primary: checkout-to-paid conversion trong session. Secondary: time to purchase, cart abandonment. Guardrails: refund rate, payment failure, support tickets, fraud review rate. Logging: assignment, exposure, checkout_start, payment_success/failure, refund.</p>')+
      practice('Data logging task','<p>Nêu 4 lỗi logging khiến experiment không đọc được.</p>', '<p>Không log exposure khi UI thực sự render; user đổi variant giữa sessions; outcome event không join được user_id/assignment_id; bot/internal traffic không excluded; timestamps mix timezone; event schema thay đổi giữa test.</p>')
    ]
  },
  {
    subtitle:'Đọc kết quả experiment như decision memo: lift, pitfalls, guardrails, recommendation và rollout plan.',
    sections:[
      '<table><tr><th>Readout</th><th>Nội dung</th><th>Câu hỏi</th></tr><tr><td>Executive summary</td><td>Ship / do not ship / iterate</td><td>Quyết định là gì?</td></tr><tr><td>Evidence</td><td>Lift, CI, p-value, guardrails</td><td>Độ tin cậy ra sao?</td></tr><tr><td>Risks</td><td>Seasonality, novelty, bugs</td><td>Có caveat nào?</td></tr></table>',
      '<ul><li>Cấu trúc experiment readout có recommendation rõ.</li><li>Diễn giải lift bằng baseline, absolute impact và confidence interval.</li><li>Nhận diện segmentation pitfalls, novelty effects, seasonality, multiple testing.</li><li>Viết business recommendation và decision memo production-ready.</li></ul>',
      '<h3>Readout structure</h3>'+codeBlock('experiment_readout.md','# Experiment Readout: Onboarding Checklist\nDecision: Iterate, chưa ship 100%.\nPrimary metric: D7 activation +1.4pp, CI [+0.2pp, +2.6pp], p = 0.03.\nBusiness impact: nếu giữ lift, khoảng +1,120 activated users/tháng.\nGuardrails: support tickets +18% ở new users, p95 onboarding latency không đổi.\nSRM check: PASS, control 50.1% vs treatment 49.9%.\nInterpretation: checklist giúp activation nhưng copy hiện tại gây confusion.\nRecommendation: ship to 25% traffic với revised copy, add help link, monitor support tickets daily.\nRisks: chạy 10 ngày, chưa bao phủ full monthly billing cycle; cần follow-up D30 retention.')+'<h3>How to interpret lift</h3><p>Lift tương đối 10% nghe lớn, nhưng nếu baseline 1% thì absolute lift chỉ 0.1 percentage point. Readout tốt luôn nêu baseline, absolute lift, relative lift, confidence interval và estimated business impact.</p><h3>SRM: Sample Ratio Mismatch</h3><p><strong>SRM</strong> xảy ra khi tỷ lệ users thực tế giữa control/treatment lệch đáng kể so với allocation kỳ vọng, ví dụ design 50/50 nhưng exposure nhận 62/38. Đây thường là dấu hiệu bug assignment, eligibility filter khác nhau, tracking bị chặn theo browser, hoặc treatment render fail. Nếu SRM fail, đừng đọc lift như kết quả đáng tin cho đến khi điều tra xong.</p>'+codeBlock('srm_check.sql','<span class="comment">-- Kiểm tra allocation 50/50 có bị lệch rõ không</span>\nSELECT\n  experiment_id,\n  variant,\n  COUNT(DISTINCT user_id) AS exposed_users,\n  ROUND(100.0 * COUNT(DISTINCT user_id) / SUM(COUNT(DISTINCT user_id)) OVER (PARTITION BY experiment_id), 2) AS pct\nFROM fact_experiment_exposure\nWHERE experiment_id = \'exp_onboarding_checklist_v2\'\nGROUP BY experiment_id, variant\nORDER BY variant;')+'<h3>Pitfalls</h3><ul><li><strong>Segmentation:</strong> càng chia nhỏ càng dễ tìm winner giả. Segment quan trọng nên predefine.</li><li><strong>Novelty:</strong> effect có thể giảm khi user hết tò mò.</li><li><strong>Seasonality:</strong> weekend, campaign, payday, holiday có thể làm sai interpretation.</li><li><strong>Instrumentation bugs:</strong> missing exposure events, duplicate assignments hoặc SRM phá kết quả.</li><li><strong>Multiple testing:</strong> nhiều metric và segment làm tăng false positive.</li></ul>'+info('warn','⚠️','Anti-pattern: gửi bảng số liệu không có recommendation. Người đọc cần biết nên ship, stop, iterate, ramp hay collect more data.')+'<h3>Decision memo mindset</h3><p>Data Engineer không cần thay Product quyết định, nhưng phải nói rõ dữ liệu hỗ trợ quyết định nào, rủi ro data nào còn tồn tại, và điều kiện nào cần theo dõi sau rollout.</p>',
      quizHtml(5),
      summary([['Readout','Bắt đầu bằng decision, không bắt đầu bằng raw tables.'],['Lift','Luôn đọc kèm baseline, CI và absolute impact.'],['Pitfalls','Segmentation, novelty, seasonality, multiple testing.'],['Instrumentation','Exposure và assignment events phải đáng tin.'],['Guardrails','Primary thắng nhưng guardrail xấu có thể không ship.'],['Memo','Recommendation, evidence, risks, rollout, follow-up.']]),
      practice('Experiment readout task','<p>Primary metric conversion +3%, p=0.04; refund rate +12%, support tickets +9%. Viết recommendation.</p>', '<p>Không ship rộng ngay. Recommendation: pause full rollout, investigate refund reasons by SKU/channel, run revised treatment hoặc add guardrail mitigation. Primary lift có ý nghĩa nhưng guardrails xấu cho thấy conversion có thể đến từ buyer confusion hoặc low-quality purchases.</p>')+
      practice('Pitfall diagnosis task','<p>Experiment notification thắng ở ngày 1-2 nhưng effect biến mất ngày 7. Giải thích.</p>', '<p>Khả năng novelty effect: user click vì notification mới lạ. Cần đọc time-series lift, retention/churn guardrails, và không quyết định chỉ từ early spike. Có thể ship nếu mục tiêu là short-term alert, nhưng không nếu mục tiêu là durable engagement.</p>')
    ]
  },
  {
    subtitle:'Đóng gói portfolio artifact week22_kpi_dashboard/ để recruiter thấy được tư duy data product end-to-end.',
    sections:[
      '<table><tr><th>File</th><th>Mục đích</th><th>Reviewer tìm gì?</th></tr><tr><td>metric_framework.md</td><td>North Star, tree, guardrails</td><td>Business thinking</td></tr><tr><td>dashboard_queries.sql</td><td>Query cho KPI/trend/breakdown</td><td>SQL production realism</td></tr><tr><td>experiment_readout.md</td><td>Kết quả và recommendation</td><td>Decision quality</td></tr></table>',

      '<h3>Folder structure bắt buộc</h3>'+codeBlock('week22_kpi_dashboard/tree','week22_kpi_dashboard/\n├── metric_framework.md\n├── metric_definitions.md\n├── dashboard_wireframe.md\n├── dashboard_queries.sql\n├── experiment_design.md\n├── experiment_readout.md\n├── data_quality_checks.sql\n├── screenshots/\n│   ├── executive_dashboard_annotated.png\n│   └── exploratory_dashboard_filters.png\n└── README.md')+'<h3>README portfolio-ready</h3>'+codeBlock('README.md','# Week 22 KPI Dashboard\n\n## Business context\nSaaS collaboration product muốn tăng weekly activated teams mà không làm tăng support load.\n\n## Target users\nExecutive: xem business health mỗi tuần.\nProduct Manager: quyết định ưu tiên activation và retention.\nOperations/Data: theo dõi freshness, incidents và guardrails.\n\n## KPI framework\nNorth Star: weekly activated teams.\nSupporting metrics: signup quality, D7 activation, collaboration actions, D30 retention.\nGuardrails: support tickets per 100 teams, p95 latency, churn, downgrade rate.\n\n## Dashboard screenshots\n![Executive dashboard with annotations](screenshots/executive_dashboard_annotated.png)\nCallout 1: KPI cards show target, WoW change, freshness and owner.\nCallout 2: North Star trend includes launch and outage annotations.\nCallout 3: Guardrail panel shows support tickets and latency before rollout decision.\n\n## Dashboard decisions\nExecutive dashboard có 5 KPI cards, 12-week trend, activation funnel và guardrail panel.\nExploratory dashboard có filters theo channel, plan, region, signup cohort.\n\n## Experiment design\nOnboarding checklist A/B test, primary metric D7 activation, guardrails support tickets and latency.\n\n## Data quality checks\nFreshness, duplicate exposure, null user_id, bot/internal exclusion, denominator sanity, SRM check.\n\n## Lessons learned\nDashboard đáng tin cần metric contract, lineage, owner và recommendation, không chỉ visualization.')+'<h3>Believable SQL examples</h3>'+codeBlock('dashboard_queries.sql','<span class="comment">-- KPI card: weekly activated teams and WoW change</span>\nWITH weekly AS (\n  SELECT\n    DATE_TRUNC(\'week\', activity_date)::date AS week_start,\n    COUNT(DISTINCT account_id) FILTER (\n      WHERE active_users >= 3 AND collaborative_actions >= 5\n    ) AS weekly_activated_teams\n  FROM mart_account_activity_daily\n  WHERE activity_date >= CURRENT_DATE - INTERVAL \'16 weeks\'\n    AND is_internal_account = FALSE\n  GROUP BY 1\n), ranked AS (\n  SELECT *, LAG(weekly_activated_teams) OVER (ORDER BY week_start) AS prev_week\n  FROM weekly\n)\nSELECT\n  week_start,\n  weekly_activated_teams,\n  ROUND(100.0 * (weekly_activated_teams - prev_week) / NULLIF(prev_week, 0), 2) AS wow_pct\nFROM ranked\nORDER BY week_start;')+codeBlock('data_quality_checks.sql','<span class="comment">-- Freshness check cho dashboard executive</span>\nSELECT\n  MAX(activity_date) AS max_activity_date,\n  CASE\n    WHEN MAX(activity_date) >= CURRENT_DATE - INTERVAL \'1 day\' THEN \'PASS\'\n    ELSE \'FAIL\'\n  END AS freshness_status\nFROM mart_account_activity_daily;\n\n<span class="comment">-- Denominator sanity: activation denominator không được bằng 0 ở cohort có signup</span>\nSELECT signup_date, acquisition_channel\nFROM mart_user_activation_daily\nGROUP BY signup_date, acquisition_channel\nHAVING SUM(eligible_signups) = 0 AND SUM(raw_signups) > 0;')+info('tip','✅','Dashboard có thể làm bằng Tableau Public, Metabase, Looker Studio hoặc static mockup. Điểm portfolio nằm ở decision logic, metric contract, queries, screenshots có annotation và data quality, không nằm ở tool cụ thể.') ,

      '<h3>Mini Test Tổng Kết</h3><div id="final-test"></div><div class="test-actions"><button class="nav-btn primary" onclick="gradeFinalTest()">✅ Chấm điểm mini test</button><button class="nav-btn" onclick="resetFinalTest()">↻ Làm lại từ đầu</button></div><div class="test-result" id="final-test-result" style="display:none"></div>'

function render() {
  document.getElementById('nav').innerHTML = moduleTitles.map((m,i)=>'<div class="nav-item '+(i===0?'active':'')+'" onclick="showModule('+i+',this)"><span class="nav-number">'+m[0]+'</span>'+m[1]+'</div>').join('');
  document.getElementById('main').innerHTML = modules.map((m,i)=>moduleHtml(i,m)).join('');
  renderFinalTest();
}
function moduleHtml(i,m) {
  const headers = ['1. Menu Tổng Thể','2. Mục Đích Module','3. Giải Thích Chi Tiết','4. Câu Hỏi Ôn Tập','5. Tổng Kết','6. Bài Tập Thực Hành'];
  const icons = ['icon-purpose','icon-purpose','icon-detail','icon-quiz','icon-summary','icon-practice'];
  const sections = headers.map((h,j)=>'<div class="section"><div class="section-header" onclick="toggleSection(this)"><div class="section-icon '+icons[j]+'">'+(j+1)+'</div>'+h+'<span class="section-toggle">▼</span></div><div class="section-content">'+m.sections[j]+'</div></div>').join('');
  return '<div class="module '+(i===0?'active':'')+'" id="m'+i+'"><div class="module-header"><div class="module-tag">Tuần 22 · '+moduleTitles[i][0]+'</div><div class="module-title">'+moduleTitles[i][1]+'</div><div class="module-subtitle">'+m.subtitle+'</div><div class="progress-bar"><div class="progress-fill" style="width:'+Math.round((i+1)/modules.length*100)+'%"></div></div></div>'+sections+navButtons(i)+'</div>';
}
function navButtons(i) {
  const prev = i > 0 ? '<button class="nav-btn" onclick="goPrev('+i+')">← Module trước</button>' : '<span></span>';
  const next = i < modules.length - 1 ? '<button class="nav-btn primary" onclick="goNext('+i+')">Module tiếp theo →</button>' : '<span></span>';
  return '<div class="nav-buttons">'+prev+next+'</div>';
}
function renderFinalTest() {
  const el = document.getElementById('final-test');
  if (!el) return;
  el.innerHTML = finalQuestions.map((q,i)=>'<div class="test-question" data-q="'+(i+1)+'" data-correct="'+q[2]+'"><div class="test-question-title">Q'+(i+1)+'. '+q[0]+'</div><div class="test-options">'+q[1].map((o,j)=>'<label class="test-option"><input type="radio" name="q'+(i+1)+'" value="'+labels[j]+'"> '+labels[j]+'. '+o+'</label>').join('')+'</div></div>').join('');
}
function showModule(idx, el) {
  document.querySelectorAll('.module').forEach(m=>m.classList.remove('active'));
  document.getElementById('m'+idx).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if (el) el.classList.add('active'); else document.querySelectorAll('.nav-item')[idx].classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goNext(idx) { showModule(idx + 1); }
function goPrev(idx) { showModule(idx - 1); }
function toggleSection(header) {
  const content = header.nextElementSibling;
  const toggle = header.querySelector('.section-toggle');
  const hidden = content.style.display === 'none';
  content.style.display = hidden ? 'block' : 'none';
  toggle.textContent = hidden ? '▼' : '▶';
}
function answerQuiz(el, correct, explanation) {
  const item = el.closest('.quiz-item');
  item.querySelectorAll('.quiz-opt').forEach(o=>o.classList.remove('correct','wrong'));
  el.classList.add(correct ? 'correct' : 'wrong');
  const exp = item.querySelector('.quiz-explain');
  exp.textContent = explanation;
  exp.classList.add('show');
}
function toggleSolution(btn) {
  const box = btn.nextElementSibling;
  box.classList.toggle('show');
  btn.textContent = box.classList.contains('show') ? 'Ẩn lời giải' : '💡 Xem lời giải';
}
function gradeFinalTest() {
  const questions = document.querySelectorAll('#final-test .test-question');
  let score = 0, unanswered = 0, wrong = [];
  questions.forEach((q,idx)=>{
    q.classList.remove('correct','wrong','unanswered');
    const selected = q.querySelector('input[type="radio"]:checked');
    const correct = q.dataset.correct;
    if (!selected) { unanswered++; q.classList.add('unanswered'); wrong.push(idx+1); return; }
    if (selected.value === correct) { score++; q.classList.add('correct'); } else { q.classList.add('wrong'); wrong.push(idx+1); }
  });
  let cls = score >= 16 ? 'good' : score >= 12 ? 'warn' : 'bad';
  let guidance = score >= 19 ? 'Xuất sắc. Bạn đã sẵn sàng đưa artifact Week22 vào portfolio.' : score >= 16 ? 'Tốt. Hãy rà lại các câu sai trước khi sang module maintenance.' : score >= 12 ? 'Đạt nền tảng nhưng cần ôn lại metric definitions, dashboard audience và experiment readout.' : 'Chưa nên đi tiếp. Hãy làm lại W22.01-W22.06 và hoàn thiện practice.';
  const result = document.getElementById('final-test-result');
  result.style.display = 'block';
  result.innerHTML = '<span class="score-chip '+cls+'">Điểm: '+score+'/'+questions.length+'</span><span class="score-chip">Chưa trả lời: '+unanswered+'</span><p>'+guidance+'</p>'+(wrong.length ? '<p>Câu cần xem lại: '+wrong.join(', ')+'</p>' : '<p>Không có câu sai.</p>');
}
function resetFinalTest() {
  document.querySelectorAll('#final-test input[type="radio"]').forEach(i=>i.checked = false);
  document.querySelectorAll('#final-test .test-question').forEach(q=>q.classList.remove('correct','wrong','unanswered'));
  const result = document.getElementById('final-test-result');
  result.style.display = 'none';
  result.innerHTML = '';
}
render();
</script>
