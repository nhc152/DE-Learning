function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

}

function info(type, text) {
  const icon = type === 'tip' ? '✓' : type === 'warn' ? '!' : 'i';
  return `<div class="info-box ${type}"><strong>${icon}</strong><span>${text}</span></div>`;
}

    detail: `
      <h3>SLA, SLO, SLI nói đơn giản</h3>
      <p><strong>SLA</strong> là lời hứa với business: “Revenue dashboard sẵn sàng trước 08:00.” <strong>SLO</strong> là mục tiêu vận hành nội bộ: “Mart build xong trước 07:30 trong 99% ngày làm việc.” <strong>SLI</strong> là số đo cụ thể: freshness timestamp, success rate, runtime, row-count anomaly.</p>
      <table><tr><th>Loại</th><th>Ví dụ cho daily_sales</th><th>Ai quan tâm?</th></tr>
      <tr><td>SLA</td><td>Dashboard doanh thu D-1 available trước 08:00 ICT mỗi business day.</td><td>Finance, leadership.</td></tr>
      <tr><td>SLO</td><td>Pipeline hoàn tất trước 07:30 trong 99% business days.</td><td>Data team.</td></tr>
      <tr><td>SLI freshness</td><td><code>max(order_date)</code> trong mart = yesterday.</td><td>Data owner và dashboard consumer.</td></tr>
      <tr><td>SLI success rate</td><td>30-day successful runs / scheduled runs >= 99%.</td><td>Data manager và owner.</td></tr>
      <tr><td>SLI runtime</td><td>p95 runtime <= 35 phút.</td><td>Owner, platform.</td></tr>
      <tr><td>SLI anomaly</td><td>Row count D-1 lệch không quá 20% so với median 14 ngày cùng weekday.</td><td>Owner, analyst.</td></tr></table>
      <h3>Alert severity</h3>
      <table><tr><th>Severity</th><th>Khi nào dùng</th><th>Response expectation</th><th>Ví dụ</th></tr>
      <tr><td>P0</td><td>Data sai/thiếu ảnh hưởng quyết định cấp công ty hoặc external reporting ngay.</td><td>Ack trong 15 phút, status update mỗi 15 phút.</td><td>Investor profit mart sai trước board pack.</td></tr>
      <tr><td>P1</td><td>Pipeline critical trễ SLA hoặc dashboard core stale.</td><td>Ack trong 30 phút, update mỗi 30 phút.</td><td>daily_sales chưa ready lúc 07:45.</td></tr>
      <tr><td>P2</td><td>Ảnh hưởng một nhóm người dùng, có workaround.</td><td>Ack trong giờ hành chính, xử lý trong business day.</td><td>Experiment mart trễ nhưng không có launch hôm nay.</td></tr>
      <tr><td>P3</td><td>Debt, warning, noise, improvement.</td><td>Backlog với owner/due date, không page ngoài giờ.</td><td>Runtime tăng dần nhưng chưa miss SLO.</td></tr></table>
      <h3>Data Observability: từ manual tests sang phát hiện bất thường tự động</h3>
      <p>Manual data tests vẫn rất cần cho rule đã biết, ví dụ <code>revenue >= 0</code> hoặc <code>payment_status</code> thuộc accepted values. Nhưng production hiện đại còn dùng <strong>Data Observability</strong> để tự động theo dõi freshness, volume, schema, distribution và lineage. Các platform như Monte Carlo, Metaplane hoặc Datafold thường học baseline lịch sử rồi cảnh báo anomaly mà bạn chưa viết rule thủ công.</p>
      <table><tr><th>Cách tiếp cận</th><th>Mạnh ở đâu</th><th>Giới hạn</th></tr>

      <h3>Reliability debt</h3>
      <p>Reliability debt là phần “nợ” khiến pipeline dễ fail hoặc khó recover: manual steps không được script, alert không có owner, test flaky, runbook lỗi thời, secrets không có rotation, một người duy nhất hiểu pipeline, hoặc quality checks chỉ nằm trong đầu analyst.</p>

      <tr><td>Noisy alert</td><td>P3 warning đánh thức on-call.</td><td>Điều chỉnh threshold và routing.</td></tr>
      <tr><td>Bus factor</td><td>Một người duy nhất biết logic investor metric.</td><td>Pairing, docs, secondary owner drill.</td></tr>
      <tr><td>Missing contract</td><td>Schema change phá staging.</td><td>Schema tests và change policy.</td></tr>
      <tr><td>Cost risk</td><td>Runtime/scan tăng dần không ai review.</td><td>Cost SLI và PR checklist.</td></tr></table>
      <h3>Prioritizing maintenance work</h3>
      <p>Không phải risk nào cũng xử lý ngay. Dùng score đơn giản: probability 1-5 x impact 1-5. Risk có score cao, lặp lại nhiều lần hoặc ảnh hưởng stakeholder critical nên được đưa vào sprint. Maintenance work tốt luôn có outcome đo được: giảm P1, giảm runtime, giảm alert noise, tăng test coverage cho mart critical.</p>

function renderMenuRows(rows) {
  return `<table><tr><th>Chủ đề</th><th>Ý nghĩa trong production</th></tr>${rows.map(r => `<tr><td><strong>${esc(r[0])}</strong></td><td>${r[1]}</td></tr>`).join('')}</table>`;
}

function renderGoals(goals) {
  return `<ul>${goals.map(g => `<li>${g}</li>`).join('')}</ul>`;
}

function renderQuiz(quiz) {
  if (!quiz || quiz.length === 0) {
    return `${info('note', 'Module này dùng phần Mini Test 20 câu ở cuối file làm bài kiểm tra chính. Hãy tập trung vào final test thay vì làm thêm một quiz lặp lại.')}`;
  }
  return quiz.map((q, qi) => {
    const labels = ['A','B','C','D'];
    const correctIndex = labels.indexOf(q[2]);
    const choices = q[1].map((opt, oi) => ({ opt, explanation: q[3][oi], correct: oi === correctIndex }));
    const shift = qi % labels.length;
    const shuffled = choices.slice(shift).concat(choices.slice(0, shift));
    const opts = shuffled.map((choice, oi) => `<div class="quiz-opt" data-correct="${choice.correct}" data-explanation="${esc(choice.explanation)}" onclick="answerQuiz(this, ${choice.correct}, this.dataset.explanation)">${labels[oi]}. ${esc(choice.opt)}</div>`).join('');
    return `<div class="quiz-item"><div class="quiz-q">${esc(q[0])}</div><div class="quiz-options">${opts}</div><div class="quiz-explain"></div></div>`;
  }).join('');
}

function renderSummary(items) {
  return `<div class="summary-grid">${items.map(i => `<div class="summary-item"><strong>${esc(i[0])}</strong>${esc(i[1])}</div>`).join('')}</div>`;
}

function renderPractices(items) {
  return items.map(item => {
    if (item[3].startsWith('<div id="final-test"')) {
      return `<div class="practice-task"><div class="practice-task-header">${esc(item[0])}</div><div class="practice-task-body"><p>${item[1]}</p><p><strong>Expected output:</strong> ${item[2]}</p>${item[3]}</div></div>`;
    }
    return `<div class="practice-task"><div class="practice-task-header">${esc(item[0])}</div><div class="practice-task-body"><p>${item[1]}</p><p><strong>Expected output:</strong> ${item[2]}</p><button class="solution-toggle" onclick="toggleSolution(this)">💡 Xem lời giải</button><div class="solution-box">${item[3].startsWith('<div') ? item[3] : codeBlock('Lời giải gợi ý', item[3])}</div></div></div>`;
  }).join('');
}

function renderFinalTest() {
  const labels = ['A','B','C','D'];
  const html = finalQuestions.map((q, i) => {
    const originalCorrectIndex = labels.indexOf(q[5]);
    const choices = labels.map((l, idx) => ({ text: q[idx + 1], correct: idx === originalCorrectIndex }));
    const shift = i % labels.length;
    const shuffled = choices.slice(shift).concat(choices.slice(0, shift));
    const correctLabel = labels[shuffled.findIndex(choice => choice.correct)];
    const opts = shuffled.map((choice, idx) => `<label class="test-option"><input type="radio" name="q${i + 1}" value="${labels[idx]}"> ${labels[idx]}. ${esc(choice.text)}</label>`).join('');
    return `<div class="test-question" data-q="${i + 1}" data-correct="${correctLabel}"><div class="test-question-title">Q${i + 1}. ${esc(q[0])}</div><div class="test-options">${opts}</div></div>`;
  }).join('');
  return `${html}<div class="test-actions"><button class="nav-btn primary" onclick="gradeFinalTest()">Chấm điểm mini test</button><button class="nav-btn" onclick="resetFinalTest()">Làm lại từ đầu</button></div><div class="test-result" id="final-test-result" style="display:none"></div>`;
}

function renderModules() {
  const nav = document.getElementById('nav');
  nav.innerHTML = moduleNames.map((m, i) => `<div class="nav-item ${i === 0 ? 'active' : ''}" onclick="showModule(${i}, this)"><span class="nav-number">${m[0]}</span>${m[1]}</div>`).join('');
  const main = document.getElementById('main');
  main.innerHTML = modulesData.map((m, i) => {
    const finalPractice = renderPractices(m.practices).replace('<div id="final-test"></div>', `<div id="final-test">${renderFinalTest()}</div>`);

    const next = i < modulesData.length - 1 ? `<button class="nav-btn primary" onclick="goNext(${i})">Module tiếp theo</button>` : '<div style="color:var(--accent2);font-weight:700">Hoàn thành Tuần 23</div>';
    return `<div class="module ${i === 0 ? 'active' : ''}" id="m${i}">
      <div class="module-header"><div class="module-tag">${m.tag}</div><div class="module-title">${m.title}</div><div class="module-subtitle">${m.subtitle}</div><div class="progress-bar"><div class="progress-fill" style="width:${Math.round(((i + 1) / modulesData.length) * 100)}%"></div></div></div>
      <div class="section"><div class="section-header" onclick="toggleSection(this)"><div class="section-icon icon-purpose">1</div>1. Menu Tổng Thể<span class="section-toggle">▼</span></div><div class="section-content">${renderMenuRows(m.menu)}</div></div>
      <div class="section"><div class="section-header" onclick="toggleSection(this)"><div class="section-icon icon-purpose">2</div>2. Mục Đích Module<span class="section-toggle">▼</span></div><div class="section-content">${renderGoals(m.goals)}</div></div>
      <div class="section"><div class="section-header" onclick="toggleSection(this)"><div class="section-icon icon-detail">3</div>3. Giải Thích Chi Tiết<span class="section-toggle">▼</span></div><div class="section-content">${m.detail}</div></div>
      <div class="section"><div class="section-header" onclick="toggleSection(this)"><div class="section-icon icon-quiz">4</div>4. Câu Hỏi Ôn Tập<span class="section-toggle">▼</span></div><div class="section-content">${renderQuiz(m.finalTest ? [] : m.quiz)}</div></div>
      <div class="section"><div class="section-header" onclick="toggleSection(this)"><div class="section-icon icon-summary">5</div>5. Tổng Kết<span class="section-toggle">▼</span></div><div class="section-content">${renderSummary(m.summary)}</div></div>
      <div class="section"><div class="section-header" onclick="toggleSection(this)"><div class="section-icon icon-practice">6</div>6. Bài Tập Thực Hành<span class="section-toggle">▼</span></div><div class="section-content">${finalPractice}</div></div>
      <div class="nav-buttons">${prev}${next}</div>

  }).join('');

function showModule(idx, el) {
  const modules = document.querySelectorAll('.module');
  const navItems = document.querySelectorAll('.nav-item');
  modules.forEach(m => m.classList.remove('active'));
  navItems.forEach(n => n.classList.remove('active'));
  modules[idx].classList.add('active');
  if (el) el.classList.add('active');
  else if (navItems[idx]) navItems[idx].classList.add('active');
  window.scrollTo(0, 0);
}

function goNext(idx) {
  const modules = document.querySelectorAll('.module');
  const navItems = document.querySelectorAll('.nav-item');
  if (idx < modules.length - 1) showModule(idx + 1, navItems[idx + 1]);
}

function goPrev(idx) {
  const navItems = document.querySelectorAll('.nav-item');
  if (idx > 0) showModule(idx - 1, navItems[idx - 1]);
}

function toggleSection(header) {
  const content = header.nextElementSibling;
  const toggle = header.querySelector('.section-toggle');
  const isHidden = content.style.display === 'none';
  content.style.display = isHidden ? 'block' : 'none';
  toggle.textContent = isHidden ? '▼' : '▶';
}

function answerQuiz(el, correct, explanation) {
  const item = el.closest('.quiz-item');
  const opts = item.querySelectorAll('.quiz-opt');
  const explain = item.querySelector('.quiz-explain');
  opts.forEach(o => o.style.pointerEvents = 'none');
  el.classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    opts.forEach(o => {
      if (o.dataset.correct === 'true') o.classList.add('correct');
    });
  }
  explain.textContent = (correct ? 'Chính xác. ' : 'Chưa đúng. ') + explanation;
  explain.classList.add('show');
}

function toggleSolution(btn) {
  const box = btn.nextElementSibling;
  const show = box.classList.toggle('show');
  btn.textContent = show ? 'Ẩn lời giải' : '💡 Xem lời giải';
}

function gradeFinalTest() {
  const questions = document.querySelectorAll('#final-test .test-question');
  const result = document.getElementById('final-test-result');
  let correctCount = 0, answeredCount = 0;
  const wrongAnswers = [], unanswered = [];
  questions.forEach(q => {
    const qNum = q.dataset.q;
    const correct = q.dataset.correct;
    const selected = q.querySelector(`input[name="q${qNum}"]:checked`);
    q.classList.remove('correct', 'wrong', 'unanswered');
    if (!selected) { q.classList.add('unanswered'); unanswered.push(qNum); return; }
    answeredCount++;
    if (selected.value === correct) { q.classList.add('correct'); correctCount++; }
    else { q.classList.add('wrong'); wrongAnswers.push({ q: qNum, selected: selected.value, correct }); }
  });
  const total = questions.length;
  const percent = Math.round((correctCount / total) * 100);
  let levelText = '', chipClass = 'warn', guidance = '';
  if (correctCount >= 19) { levelText = 'Rất tốt'; chipClass = 'good'; guidance = 'Bạn có production mindset mạnh. Hãy hoàn thiện artifact và thêm một incident drill ngắn vào README.'; }
  else if (correctCount >= 16) { levelText = 'Sẵn sàng'; chipClass = 'good'; guidance = 'Bạn đã đủ nền tảng để dùng Week23 cho portfolio. Review kỹ runbook và risk register trước khi commit.'; }
  else if (correctCount >= 12) { levelText = 'Cần củng cố'; chipClass = 'warn'; guidance = 'Ôn lại các câu sai, đặc biệt SLA/SLO/SLI, incident response và lineage trước khi sang capstone.'; }
  else { levelText = 'Chưa sẵn sàng'; chipClass = 'bad'; guidance = 'Quay lại W23.02-W23.06 và viết lại artifact bằng ví dụ daily_sales trước khi làm lại test.'; }
  const unansweredHtml = unanswered.length ? `<p><strong>Câu chưa trả lời:</strong> Q${unanswered.join(', Q')}</p>` : '';
  const wrongHtml = wrongAnswers.length ? `<p><strong>Câu sai:</strong></p><ul class="mistake-list">${wrongAnswers.map(i => `<li>Q${i.q}: bạn chọn <strong>${i.selected}</strong>, đáp án đúng <strong>${i.correct}</strong></li>`).join('')}</ul>` : '<p><strong>Tất cả câu đã trả lời đều đúng.</strong></p>';
  result.innerHTML = `<div class="score-row"><span class="score-chip ${chipClass}">Điểm: ${correctCount}/${total}</span><span class="score-chip">Tỷ lệ: ${percent}%</span><span class="score-chip ${chipClass}">Mức: ${levelText}</span><span class="score-chip">Đã trả lời: ${answeredCount}/${total}</span></div><p>${guidance}</p>${unansweredHtml}${wrongHtml}`;
  result.style.display = 'block';
  result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function resetFinalTest() {
  const questions = document.querySelectorAll('#final-test .test-question');
  const result = document.getElementById('final-test-result');
  questions.forEach(q => {
    q.classList.remove('correct', 'wrong', 'unanswered');
    q.querySelectorAll('input[type="radio"]').forEach(i => i.checked = false);
  });
  result.style.display = 'none';
  result.innerHTML = '';
}
